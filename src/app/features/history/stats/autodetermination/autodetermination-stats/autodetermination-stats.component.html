<ion-header>
  <ion-toolbar>
    <ion-title>Autodétermination</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="stats-page">
    @if (isLoading) {
      <div class="state-row">
        <ion-spinner name="crescent"></ion-spinner>
        <span>Chargement des statistiques...</span>
      </div>
    } @else {
      @if (errorMessage) {
        <ion-text color="danger" class="state-error">{{ errorMessage }}</ion-text>
      }

      @if (stats && !errorMessage) {
        <p class="progress-label">Questions répondues: {{ stats.answeredCount }} / {{ stats.totalCount }}</p>

        <div class="chart-card">
          <div class="chart-wrapper">
            <canvas #stackedCanvas [style.height.px]="chartCanvasHeightPx"></canvas>
          </div>
        </div>
      }
    }
  </div>
</ion-content>
